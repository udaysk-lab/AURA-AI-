services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
      POSTGRES_DB: aura
    ports:
      - "5432:5432"
    volumes:
      - aura_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aura:aura@db:5432/aura
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # Migrate before serving. With AUTO_CREATE_SCHEMA unset the app would also
    # create tables itself; running alembic first keeps one owner of the schema.
    command: >
      sh -c "alembic upgrade head 2>/dev/null || echo 'no migrations yet — falling back to auto-create';
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Exactly one worker. Schedule de-duplication is per-process, so scaling this
  # to 2 replicas double-fires every schedule.
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aura:aura@db:5432/aura
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    command: python worker.py
    deploy:
      replicas: 1

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  aura_pgdata:
