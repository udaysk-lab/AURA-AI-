# Checks every push and pull request.
#
# The backend suite runs on Linux, Windows and macOS because AURA's desktop
# app runs on all three, and the device code (the shell, processes, opening
# apps) behaves differently on each. Linux also runs it once without the
# optional device packages, since the app must work without them too.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (${{ matrix.os }}${{ matrix.extras == 'none' && ', no device packages' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        extras: [device]
        include:
          - os: ubuntu-latest
            extras: none
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-device.txt
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ matrix.extras }}" = "device" ]; then pip install -r requirements-device.txt; fi
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
      - name: Migrations match the models
        if: matrix.os == 'ubuntu-latest' && matrix.extras == 'device'
        env:
          DATABASE_URL: sqlite:///./migration-check.db
          AUTO_CREATE_SCHEMA: "false"
        run: |
          python -m alembic upgrade head
          python -m alembic check

  frontend:
    name: Frontend typecheck and builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Hosted build
        run: npx next build
      - name: Desktop build (static export)
        run: npm run build:desktop
      - name: Known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high
